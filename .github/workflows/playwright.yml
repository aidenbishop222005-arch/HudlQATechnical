name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hudl-login-tests
  cancel-in-progress: false

jobs:
  quality:
    name: Type check, lint, and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Playwright tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUDL_EMAIL: ${{ secrets.HUDL_EMAIL }}
      HUDL_PASSWORD: ${{ secrets.HUDL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm test